<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://owgldsfxpmzpkipgeksr.supabase.co wss://owgldsfxpmzpkipgeksr.supabase.co https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"/>
  <title>Stord Quiz – Skann QR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Epilogue:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f0f13;--surface:#1a1a24;--border:#2a2a3a;
      --accent:#c8f050;--text:#f0f0f5;--muted:#7a7a9a;
      --red:#ff4d6d;--green:#50f0a0;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{font-size:16px;}
    body{
      background:var(--bg);color:var(--text);
      font-family:'Epilogue',sans-serif;
      min-height:100vh;display:flex;flex-direction:column;
    }

    /* ── TOPBAR ── */
    .topbar{
      background:var(--surface);border-bottom:1px solid var(--border);
      padding:0 clamp(1rem,3vw,1.5rem);height:clamp(52px,8vw,64px);
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:100;flex-shrink:0;
    }
    .topbar-logo{
      font-family:'Fraunces',serif;font-weight:900;
      font-size:clamp(1.1rem,3vw,1.3rem);color:var(--accent);text-decoration:none;
    }
    .back-btn{
      background:var(--surface);border:1px solid var(--border);
      border-radius:10px;padding:clamp(.4rem,1.5vw,.5rem) clamp(.75rem,2vw,1rem);
      font-family:'Epilogue',sans-serif;font-size:clamp(.78rem,2vw,.85rem);
      font-weight:500;color:var(--muted);cursor:pointer;
      transition:border-color .15s,color .15s;text-decoration:none;
    }
    .back-btn:hover{border-color:var(--text);color:var(--text);}

    /* ── MAIN WRAP ── */
    .wrap{
      width:100%;max-width:520px;margin:0 auto;
      padding:clamp(1.25rem,4vw,2.5rem) clamp(1rem,3vw,1.5rem) clamp(2rem,6vw,4rem);
      display:flex;flex-direction:column;align-items:center;gap:clamp(1rem,3vw,1.5rem);
      flex:1;
    }

    .page-title{
      font-family:'Fraunces',serif;font-weight:900;
      font-size:clamp(1.6rem,5vw,2rem);letter-spacing:-.5px;
      text-align:center;line-height:1.1;
    }
    .page-title span{font-style:italic;color:var(--accent);}
    .page-sub{font-size:clamp(.8rem,2.5vw,.88rem);color:var(--muted);text-align:center;margin-top:-.5rem;}

    /* ── IDENTITY CHIP ── */
    .identity-chip{
      display:flex;align-items:center;gap:.6rem;
      background:var(--surface);border:1px solid var(--border);
      border-radius:100px;padding:.45rem 1rem .45rem .6rem;
      font-size:clamp(.78rem,2vw,.85rem);width:100%;max-width:340px;justify-content:center;
    }
    .id-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .id-name{font-weight:600;}
    .id-score{color:var(--accent);font-family:'Fraunces',serif;font-weight:700;margin-left:.25rem;}
    .no-session-warn{
      background:#2a0a0a;border:1px solid var(--red);
      border-radius:14px;padding:.85rem 1.1rem;
      font-size:clamp(.82rem,2.5vw,.9rem);color:var(--red);text-align:center;width:100%;
    }
    .no-session-warn a{color:var(--accent);font-weight:600;text-decoration:none;}

    /* ── SCANNER CARD ── */
    .scanner-card{
      background:var(--surface);border:2px solid var(--border);
      border-radius:20px;overflow:hidden;width:100%;
    }
    .scanner-card-header{
      padding:clamp(.75rem,2vw,1rem) clamp(1rem,3vw,1.25rem);
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:.5rem;
    }
    .scanner-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1.5s ease-in-out infinite;}
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
    .scanner-label{font-size:clamp(.8rem,2.5vw,.88rem);color:var(--muted);}
    .scanner-label strong{color:var(--text);font-weight:600;}

    /* Override html5-qrcode default styles to match dark theme */
    #qr-reader{width:100%!important;border:none!important;background:var(--bg)!important;}
    #qr-reader video{border-radius:0!important;border:none!important;}
    #qr-reader__scan_region{background:var(--bg)!important;}
    #qr-reader__scan_region img{opacity:.15!important;filter:invert(1)!important;}
    #qr-reader__dashboard{
      padding:clamp(.75rem,2vw,1rem)!important;
      background:var(--surface)!important;
      border-top:1px solid var(--border)!important;
    }
    #qr-reader__dashboard_section_csr button{
      font-family:'Epilogue',sans-serif!important;
      font-size:clamp(.78rem,2vw,.85rem)!important;
      color:var(--text)!important;background:var(--bg)!important;
      border:1px solid var(--border)!important;border-radius:10px!important;
      padding:clamp(.4rem,1.5vw,.5rem) clamp(.75rem,2vw,1rem)!important;
      cursor:pointer!important;transition:border-color .15s!important;
    }
    #qr-reader__dashboard_section_csr button:hover{border-color:var(--accent)!important;}
    #qr-reader select{
      font-family:'Epilogue',sans-serif!important;
      font-size:clamp(.78rem,2vw,.85rem)!important;
      border:1px solid var(--border)!important;border-radius:10px!important;
      padding:.5rem .75rem!important;
      background:var(--bg)!important;color:var(--text)!important;
    }
    #qr-reader__camera_permission_button{
      background:var(--accent)!important;color:#0f0f13!important;
      border:none!important;font-family:'Fraunces',serif!important;
      font-size:clamp(.9rem,2.5vw,1rem)!important;font-weight:700!important;
      padding:clamp(.75rem,2.5vw,.9rem) clamp(1.25rem,4vw,1.75rem)!important;
      border-radius:12px!important;cursor:pointer!important;
    }
    #qr-reader__status_span{
      color:var(--muted)!important;
      font-family:'Epilogue',sans-serif!important;
      font-size:clamp(.78rem,2vw,.82rem)!important;
    }
    #qr-reader__header_message{
      color:var(--muted)!important;
      font-family:'Epilogue',sans-serif!important;
      font-size:clamp(.78rem,2vw,.82rem)!important;
    }
    #qr-reader__filescan_input{color:var(--text)!important;}

    /* ── STATUS ── */
    .status-msg{
      width:100%;padding:clamp(.7rem,2vw,.85rem) clamp(.9rem,2.5vw,1.1rem);
      border-radius:12px;font-size:clamp(.82rem,2.5vw,.9rem);font-weight:500;display:none;
    }
    .status-msg.error  {background:#2a0a0a;color:var(--red);border:1px solid #5a1b1b;display:block;}
    .status-msg.success{background:#1a2a00;color:var(--green);border:1px solid #2d5a1b;display:block;}
    .status-msg.info   {background:#0a1a2a;color:#4d9fff;border:1px solid #1b3a5a;display:block;}

    /* ── RESULT CARD ── */
    .result-card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:20px;padding:clamp(1.1rem,3vw,1.5rem);
      width:100%;display:none;flex-direction:column;gap:clamp(.85rem,2.5vw,1.1rem);
    }
    .result-card.visible{display:flex;}
    .result-header{display:flex;align-items:center;gap:clamp(.75rem,2.5vw,1rem);}
    .result-emoji{font-size:clamp(1.8rem,6vw,2.2rem);line-height:1;flex-shrink:0;}
    .result-name{font-family:'Fraunces',serif;font-size:clamp(1.1rem,3.5vw,1.3rem);font-weight:900;}
    .result-label{font-size:clamp(.68rem,2vw,.75rem);color:var(--green);margin-top:2px;font-weight:600;}
    .result-actions{display:flex;gap:.65rem;}
    .btn-secondary{
      flex:1;padding:clamp(.7rem,2vw,.85rem);
      border:1px solid var(--border);border-radius:12px;
      background:transparent;font-family:'Epilogue',sans-serif;
      font-size:clamp(.82rem,2.5vw,.9rem);font-weight:500;color:var(--muted);
      cursor:pointer;transition:border-color .15s,color .15s;
    }
    .btn-secondary:hover{border-color:var(--text);color:var(--text);}
    .btn-primary{
      flex:2;padding:clamp(.7rem,2vw,.85rem);border:none;border-radius:12px;
      background:var(--accent);color:#0f0f13;font-family:'Fraunces',serif;
      font-size:clamp(.9rem,2.5vw,1rem);font-weight:700;cursor:pointer;
      transition:opacity .15s;text-decoration:none;
      display:flex;align-items:center;justify-content:center;
    }
    .btn-primary:hover{opacity:.85;}

    .spin-sm{display:inline-block;width:12px;height:12px;border:2px solid rgba(77,159,255,.2);border-top-color:#4d9fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:5px;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="topbar-logo">Stord Quiz</a>
    <a href="index.html" class="back-btn">← Tilbake til jakt</a>
  </header>

  <div class="wrap">
    <div class="page-title">Skann <span>QR-kode</span></div>
    <div class="page-sub">Hald kameraet over QR-koden du finn ute</div>

    <!-- Identity chip (shows who is logged in to the hunt) -->
    <div id="identity-area"></div>

    <!-- Fallback for insecure context (HTTP) -->
    <div id="insecure-banner" style="display:none;width:100%;background:#1a1a0a;border:1px solid #5a5a00;border-radius:14px;padding:1rem 1.1rem;font-size:.88rem;color:#f0c050;text-align:center;">
      ⚠️ Kamera krev HTTPS. Bruk <strong>telefon-kameraet</strong> ditt til å skanne QR-kodane direkte — svar opnar seg automatisk i nettlesaren.
    </div>

    <!-- Scanner -->
    <div class="scanner-card" id="scanner-card">
      <div class="scanner-card-header">
        <div class="scanner-dot"></div>
        <span class="scanner-label"><strong>Kamera aktivt</strong> – finn ein QR-kode</span>
      </div>
      <div id="qr-reader"></div>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <!-- Result card (shown when already answered) -->
    <div class="result-card" id="resultCard">
      <div class="result-header">
        <div class="result-emoji" id="resultEmoji">🎯</div>
        <div>
          <div class="result-name" id="resultName">–</div>
          <div class="result-label" id="resultLabel">Allereie svart</div>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn-secondary" onclick="resetScanner()">Skann ny</button>
        <a class="btn-primary" id="resultLink" href="index.html">← Tilbake til jakt</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://owgldsfxpmzpkipgeksr.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93Z2xkc2Z4cG16cGtpcGdla3NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MDM2NTYsImV4cCI6MjA5MjM3OTY1Nn0.bD5dNHcQfjjq29DprTnVafxuZeCvt30zu0qQItq6AXY'
    const { createClient } = supabase
    const db = createClient(SUPABASE_URL, SUPABASE_KEY)

    let scanner  = null
    let scanDone = false

    // ── SHOW IDENTITY ──
    const escHtml = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
    const safeColor = c => /^#[0-9A-Fa-f]{3}([0-9A-Fa-f]{3})?$/.test(c || '') ? c : '#c8f050'
    const identity = JSON.parse(localStorage.getItem('quiz_identity') || 'null')
    const identityArea = document.getElementById('identity-area')
    if (identity?.playerId) {
      // Fetch current score
      db.from('session_players').select('total_score,avatar_color').eq('id', identity.playerId).single().then(({ data }) => {
        identityArea.innerHTML = `
          <div class="identity-chip">
            <div class="id-dot" style="background:${safeColor(data?.avatar_color)}"></div>
            <span class="id-name">${escHtml(identity.nickname)}</span>
            <span class="id-score">⭐ ${Number(data?.total_score) || 0} poeng</span>
          </div>`
      })
    } else {
      identityArea.innerHTML = `
        <div class="no-session-warn">
          ⚠️ Du er ikkje med i ein quiz.
          <a href="index.html">Bli med her →</a>
        </div>`
    }

    // ── INIT SCANNER ──
    function initScanner() {
      scanner = new Html5QrcodeScanner('qr-reader', {
        fps: 10,
        qrbox: { width: Math.min(240, window.innerWidth - 80), height: Math.min(240, window.innerWidth - 80) },
        rememberLastUsedCamera: true,
        showTorchButtonIfSupported: true,
        videoConstraints: { facingMode: { ideal: 'environment' } }
      })
      scanner.render(onScanSuccess, () => {})
    }

    // ── ON SCAN ──
    async function onScanSuccess(decodedText) {
      if (scanDone) return
      scanDone = true
      if (scanner) scanner.clear().catch(() => {})

      showStatus('<span class="spin-sm"></span> Les QR-kode…', 'info')

      let questionId = null
      try {
        const url = new URL(decodedText)
        questionId = url.searchParams.get('id')
      } catch {
        if (decodedText.trim().length > 10) questionId = decodedText.trim()
      }

      if (!questionId) {
        showStatus('❌ Ugyldig QR-kode. Prøv igjen.', 'error')
        scanDone = false
        initScanner()
        return
      }

      // Must have identity
      if (!identity?.playerId) {
        showStatus('❌ Du er ikkje med i ein quiz. Gå tilbake og bli med fyrst.', 'error')
        setTimeout(() => { location.href = 'index.html' }, 2000)
        return
      }

      // Check already answered (token-verifisert RPC)
      const { data: myAnswers } = await db
        .rpc('get_my_answers', { p_player_id: identity.playerId, p_token: identity.token })
      const existing = (myAnswers || []).find(a => a.question_id === questionId) || null

      if (existing) {
        clearStatus()
        document.getElementById('resultEmoji').textContent = existing.is_correct ? '✅' : '❌'
        document.getElementById('resultName').textContent  = existing.is_correct
          ? 'Du svarte riktig på dette spørsmålet!'
          : 'Du svarte feil på dette spørsmålet'
        document.getElementById('resultLabel').textContent = 'Berre eitt forsøk per QR-kode'
        document.getElementById('resultLabel').style.color = existing.is_correct ? 'var(--green)' : 'var(--red)'
        document.getElementById('resultCard').classList.add('visible')
        return
      }

      // All good – redirect
      showStatus('✅ Fann spørsmål! Omdirigerer…', 'success')
      setTimeout(() => { location.href = `question.html?id=${questionId}` }, 500)
    }

    function resetScanner() {
      scanDone = false
      clearStatus()
      document.getElementById('resultCard').classList.remove('visible')
      if (scanner) scanner.clear().catch(() => {})
      scanner = null
      document.getElementById('qr-reader').innerHTML = ''
      initScanner()
    }

    function showStatus(html, type) {
      const el = document.getElementById('statusMsg')
      el.innerHTML = html
      el.className = 'status-msg ' + type
    }
    function clearStatus() {
      const el = document.getElementById('statusMsg')
      el.className = 'status-msg'
      el.innerHTML = ''
    }

    // Detect insecure context — camera API blocked on HTTP
    if (!window.isSecureContext) {
      document.getElementById('insecure-banner').style.display = 'block'
      document.getElementById('scanner-card').style.display = 'none'
    } else if (typeof Html5QrcodeScanner === 'undefined') {
      document.getElementById('qr-reader').innerHTML =
        '<p style="color:var(--red);padding:1rem;text-align:center;font-size:.9rem;">❌ Kunne ikkje laste QR-skanner. Sjekk internettforbindinga og last sida på nytt.</p>'
    } else {
      initScanner()
    }
  </script>
</body>
</html>
